<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SenuaHell | Hesabım</title><link rel="stylesheet" href="auth-header.css"><style>body{margin:0;background:radial-gradient(circle at 50% 0,#321044,#0b0712 55%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.nav{max-width:1200px;margin:auto;min-height:68px;padding:0 22px;display:flex;align-items:center;gap:22px}.brand{font-size:24px;font-weight:900;color:white;text-decoration:none}.links{display:flex;gap:20px;flex:1}.links a{color:#d7c9e5;text-decoration:none;font-size:13px}.wrap{width:min(650px,calc(100% - 30px));margin:45px auto}.panel{background:#130d1e;border:1px solid #ffffff20;border-radius:18px;padding:25px;margin:15px 0}h1{margin:0 0 15px}h2{font-size:18px}label{display:block;margin:12px 0 6px;color:#d9cbe4;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #ffffff25;background:#0c0812;color:white}button{border:0;border-radius:9px;padding:11px 15px;background:#9636bd;color:white;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}.secondary{background:#292039;border:1px solid #ffffff25}.status{padding:10px;background:#21172b;border-radius:8px;color:#d9cbe4;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row span{flex:1}.hint{font-size:12px;color:#a99bb7}.msg{margin:12px 0;color:#e9caff}@media(max-width:700px){.links{display:none}.nav{padding:0 15px}}</style><link rel="stylesheet" href="purple-atmosphere.css?v=3"></head><body><header style="background:#090512dd;border-bottom:1px solid #ffffff18"><nav class="nav"><a class="brand" href="index.html">SenuAhell ✦</a><div class="links"><a href="index.html">Ana Sayfa</a><a href="sistemim.html">Sistemim</a><a href="kick.html">Klipler & Yayınlar</a><a href="instagram.html">Instagram</a><a href="youtube.html">YouTube</a></div><div class="auth-nav"><a href="hesap.html">Hesabım</a></div></nav></header><main class="wrap"><h1>Hesabım</h1><div id="msg" class="msg"></div><section class="panel"><h2>Hesap bilgileri</h2><div class="row"><span>Kullanıcı adı: <b id="currentName">-</b></span></div><label>Yeni kullanıcı adı</label><input id="newName" maxlength="24" placeholder="3-24 karakter"><p class="hint">Kullanıcı adını 14 günde bir değiştirebilirsin.</p><label>E-posta (isteğe bağlı)</label><input id="email" type="email" placeholder="ornek@eposta.com"><p class="hint">E-posta adresini 14 günde bir değiştirebilirsin.</p><button id="saveProfile">Değişiklikleri kaydet</button></section><section class="panel"><h2>Bağlı hesaplar</h2><div class="status" id="discordState">Discord: kontrol ediliyor</div><button class="secondary" id="discordBtn">Discord hesabını bağla</button><div class="status" id="kickState" style="margin-top:12px">Kick: kontrol ediliyor</div><button class="secondary" id="kickBtn">Kick hesabını bağla</button></section><section class="panel"><h2>Şifre değiştir</h2><label>Mevcut şifre</label><input id="oldPass" type="password"><label>Yeni şifre</label><input id="newPass" type="password"><label>Yeni şifre (tekrar)</label><input id="confirmPass" type="password"><button id="changePass">Şifreyi değiştir</button></section><section class="panel"><button id="logout" class="secondary">Hesaptan çıkış yap</button></section></main><script src="auth-header.js"></script><script>const $=id=>document.getElementById(id),api='/api/auth';function msg(t){$('msg').textContent=t}async function call(path,method='GET',data){const r=await fetch(api+path,{method,credentials:'same-origin',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'İşlem başarısız.');return d}async function load(){try{const d=await call('/me');$('currentName').textContent=d.user.username;$('newName').value=d.user.username;$('email').value=d.user.email||'';$('discordState').textContent='Discord: '+(d.user.discordUsername||'bağlı değil');$('kickState').textContent='Kick: '+(d.user.kickUsername||'bağlı değil')}catch(e){location.href='kayit.html'}}load();async function oauth(provider){try{const d=await call('/'+provider+'/start?json=1');location.href=d.url}catch(e){msg(e.message)}}$('discordBtn').onclick=()=>oauth('discord');$('kickBtn').onclick=()=>oauth('kick');$('saveProfile').onclick=async()=>{try{const d=await call('/profile','PATCH',{username:$('newName').value.trim(),email:$('email').value.trim()});$('currentName').textContent=d.user.username;msg('Hesap bilgilerin güncellendi.')}catch(e){msg(e.message)}};$('changePass').onclick=async()=>{try{await call('/password','POST',{currentPassword:$('oldPass').value,password:$('newPass').value,confirmPassword:$('confirmPass').value});msg('Şifren değiştirildi.');$('oldPass').value=$('newPass').value=$('confirmPass').value=''}catch(e){msg(e.message)}};$('logout').onclick=async()=>{try{await call('/logout','POST');location.href='index.html'}catch(e){msg(e.message)}};const q=new URLSearchParams(location.search);if(q.has('discord')||q.has('kick'))msg('Hesap bağlantısı tamamlandı.');if(q.has('error'))msg('Bu sosyal medya hesabı başka bir üyeliğe bağlı olabilir.');</script><script src="click-sound.js"></script><script src="purple-atmosphere.js?v=3"></script></body></html>
