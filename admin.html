<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SenuaHell | Admin Paneli</title><link rel="stylesheet" href="auth-header.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#321044,#0b0712 55%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.nav{max-width:1200px;margin:auto;min-height:68px;padding:0 22px;display:flex;align-items:center;gap:22px}.brand{font-size:24px;font-weight:900;color:white;text-decoration:none}.links{display:flex;gap:20px;flex:1}.links a{color:#d7c9e5;text-decoration:none;font-size:13px}.wrap{width:min(1150px,calc(100% - 30px));margin:38px auto}.panel{background:#130d1e;border:1px solid #ffffff20;border-radius:16px;padding:20px;margin:16px 0;overflow:auto}h1{margin:0 0 8px}h2{font-size:18px;margin-top:0}.muted{color:#ad9dbb;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,button{border:0;border-radius:8px;padding:10px 14px;background:#9636bd;color:white;font-weight:bold;cursor:pointer}.tabs button.active{background:#c15be9}.tabs button.secondary,button.secondary{background:#292039;border:1px solid #ffffff25}input,select{padding:10px;border-radius:8px;border:1px solid #ffffff25;background:#0c0812;color:#fff}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px;border-bottom:1px solid #ffffff17;font-size:13px}th{color:#d8b8e9}.msg{padding:10px;border-radius:8px;background:#21172b;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#21172b;padding:16px;border-radius:10px}.stat b{display:block;font-size:24px;margin-top:6px}.hidden{display:none}@media(max-width:700px){.links{display:none}.nav{padding:0 15px}}
</style><link rel="stylesheet" href="purple-atmosphere.css?v=3"></head><body><header style="background:#090512dd;border-bottom:1px solid #ffffff18"><nav class="nav"><a class="brand" href="index.html">SenuAhell ✦</a><div class="links"><a href="index.html">Ana Sayfa</a><a href="sistemim.html">Sistemim</a><a href="kick.html">Klipler & Yayınlar</a><a href="instagram.html">Instagram</a><a href="youtube.html">YouTube</a></div><div class="auth-nav"></div></nav></header><main class="wrap"><h1>Yönetim Paneli</h1><p class="muted">Üyeleri, rolleri ve şikâyetleri buradan yönetebilirsin.</p><div id="msg" class="msg">Panel yükleniyor...</div><div id="content" class="hidden"><div class="stats" id="stats"></div><div class="tabs"><button data-tab="users" class="active">Üyeler</button><button data-tab="complaints" class="secondary">Şikâyetler</button><button data-tab="logs" class="secondary">İşlem kayıtları</button></div><section id="users" class="panel"><h2>Üyeler</h2><input id="search" placeholder="Kullanıcı adı ara"><div id="usersTable"></div></section><section id="complaints" class="panel hidden"><h2>Şikâyetler</h2><div id="complaintsTable"></div></section><section id="logs" class="panel hidden"><h2>İşlem kayıtları</h2><div id="logsTable"></div></section></div></main><script src="auth-header.js"></script><script>
const $=id=>document.getElementById(id);let users=[];async function api(path,method='GET',data){const r=await fetch('/api/admin'+path,{method,credentials:'same-origin',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let d={};try{d=await r.json()}catch(e){throw Error('Sunucu boş yanıt verdi (HTTP '+r.status+').')}if(!r.ok)throw Error(d.error||'İşlem başarısız.');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'}function renderUsers(){const q=$('search').value.toLowerCase();$('usersTable').innerHTML=table(['ID','Kullanıcı','E-posta','Discord','Kick','Rol','İşlem'],users.filter(u=>u.username.toLowerCase().includes(q)).map(u=>'<tr><td>'+u.id+'</td><td>'+esc(u.username)+'</td><td>'+esc(u.email||'-')+'</td><td>'+esc(u.discordUsername||'-')+'</td><td>'+esc(u.kickUsername||'-')+'</td><td>'+esc(u.role)+'</td><td>'+(window.myRole==='owner'&&u.role!=='owner'?'<select data-role="'+u.id+'"><option value="member">Üye</option><option value="guide">Rehber</option><option value="moderator">Moderatör</option><option value="admin">Admin</option></select> <button data-save="'+u.id+'">Kaydet</button>':'-')+'</td></tr>').join(''))}async function load(){try{const d=await api('/overview');window.myRole=d.viewer.role;users=d.users;$('stats').innerHTML=[['Toplam üye',d.stats.users],['Açık şikâyet',d.stats.openComplaints],['Admin',d.stats.admins],['Moderatör',d.stats.moderators]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('');renderUsers();$('complaintsTable').innerHTML=table(['ID','Bildiren','Şikâyet edilen','Kategori','Açıklama','Durum'],d.complaints.map(c=>'<tr><td>'+c.id+'</td><td>'+esc(c.reporter_username)+'</td><td>'+esc(c.accused_username)+'</td><td>'+esc(c.category)+'</td><td>'+esc(c.description)+'</td><td>'+esc(c.status)+'</td></tr>').join(''));$('logsTable').innerHTML=table(['Tarih','İşlem','Yetkili ID','Hedef ID'],d.logs.map(l=>'<tr><td>'+new Date(l.created_at).toLocaleString('tr-TR')+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.actor_id)+'</td><td>'+esc(l.target_user_id||'-')+'</td></tr>').join(''));$('content').classList.remove('hidden');$('msg').textContent='Yönetim paneline hoş geldin.'}catch(e){$('msg').textContent=e.message; if(e.message.includes('Yetkin')||e.message.includes('Giriş'))setTimeout(()=>location.href='kayit.html',1800)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.classList.toggle('secondary',x!==b)});['users','complaints','logs'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});$('search').oninput=renderUsers;document.addEventListener('click',async e=>{const id=e.target.dataset.save;if(!id)return;const role=document.querySelector('[data-role="'+id+'"]').value;try{await api('/users/'+id+'/role','PATCH',{role});$('msg').textContent='Kullanıcı rolü güncellendi.';await load()}catch(err){$('msg').textContent=err.message}});load();
</script><script src="click-sound.js"></script><script src="purple-atmosphere.js?v=3"></script></body></html>
